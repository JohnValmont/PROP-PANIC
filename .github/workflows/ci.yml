name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:audio
      - run: npm run test:maps
      - run: npm run test:progress
      - run: npm run test:mechanics
      - run: npm run test:security
      - run: npm run test:stats
      - run: npm test
